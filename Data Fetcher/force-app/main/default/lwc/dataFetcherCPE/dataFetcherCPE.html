<template>
  <template lwc:if={hasValidationErrors}>
    <section
      class="slds-notify slds-notify_alert slds-theme_error"
      role="alert"
    >
      <span class="slds-assistive-text">Error</span>
      <div>
        <p>Fix the following:</p>
        <ul class="slds-list_dotted slds-m-left_medium">
          <template for:each={validationErrors} for:item="error">
            <li key={error.key}>{error.errorString}</li>
          </template>
        </ul>
      </div>
    </section>
  </template>

  <lightning-input
    type="checkbox"
    label="Use Wire Service (getListRecordsByName)"
    name="useWireService"
    checked={useWireService}
    field-level-help="When checked, uses the UI API wire service instead of SOQL queries."
    onchange={handleUseWireServiceChange}
  ></lightning-input>

  <lightning-input
    type="checkbox"
    label="Show SOSL Configuration"
    name="showSOSL"
    checked={showSOSL}
    field-level-help="When checked, SOSL configuration options are shown."
    onchange={handleShowSOSLChange}
  ></lightning-input>

  <c-flow-config-object-picker
    data-validatable
    data-property="objectName1"
    property-name="objectName1"
    label="Object Name"
    value={objectName1}
    available-object-types="All"
    queryable-only
    required
    field-level-help="Choose the Salesforce object Data Fetcher should query."
    onobjectchange={handlePrimaryObjectChange}
  ></c-flow-config-object-picker>

  <template lwc:if={useWireService}>
    <c-flow-config-value-input
      data-validatable
      data-property="listViewApiName"
      label="List View API Name"
      property-name="listViewApiName"
      value={listViewApiName}
      value-data-type={listViewApiNameDataType}
      builder-context={builderContext}
      automatic-output-variables={automaticOutputVariables}
      api-version={apiVersion}
      required
      field-level-help="API name of the list view, for example AllAccounts."
      onvaluechange={handleValueChange}
    ></c-flow-config-value-input>

    <c-flow-config-field-input
      data-validatable
      data-property="fields"
      label="Additional Fields (optional)"
      property-name="fields"
      value={fields}
      value-data-type={fieldsDataType}
      object-api-name={objectName1}
      multiple
      sortable={additionalFieldsSortable}
      builder-context={builderContext}
      automatic-output-variables={automaticOutputVariables}
      api-version={apiVersion}
      allow-custom
      custom-mode={fieldsIsCustom}
      field-level-help="Select fields from Object Name, or use a Flow value containing a comma-separated list of field API names."
      onvaluechange={handleFieldValueChange}
      onmodechange={handleFieldsModeChange}
    ></c-flow-config-field-input>

    <c-flow-config-value-input
      data-validatable
      data-property="pageSize"
      label="Page Size"
      property-name="pageSize"
      value={pageSize}
      value-data-type={pageSizeDataType}
      value-type="Number"
      builder-context={builderContext}
      automatic-output-variables={automaticOutputVariables}
      api-version={apiVersion}
      required
      field-level-help="Number of records to retrieve, from 1 through 2000."
      onvaluechange={handleValueChange}
    ></c-flow-config-value-input>

    <c-flow-config-field-input
      data-validatable
      data-property="sortBy"
      label="Sort By Field"
      property-name="sortBy"
      value={sortBy}
      value-data-type={sortByDataType}
      object-api-name={objectName1}
      builder-context={builderContext}
      automatic-output-variables={automaticOutputVariables}
      api-version={apiVersion}
      allow-custom
      custom-mode={sortByIsCustom}
      field-level-help="Choose a field from Object Name, or switch to a custom literal or Flow resource."
      onvaluechange={handleFieldValueChange}
      onmodechange={handleSortByModeChange}
    ></c-flow-config-field-input>

    <c-flow-config-value-input
      data-validatable
      data-property="pageToken"
      label="Page Token"
      property-name="pageToken"
      value={pageToken}
      value-data-type={pageTokenDataType}
      builder-context={builderContext}
      automatic-output-variables={automaticOutputVariables}
      api-version={apiVersion}
      field-level-help="Optional page token for pagination."
      onvaluechange={handleValueChange}
    ></c-flow-config-value-input>
  </template>

  <template lwc:if={hideSOQLInputs}>
    <template lwc:if={showSOSL}>
      <c-flow-config-object-picker
        data-validatable
        data-property="objectName2"
        property-name="objectName2"
        label="Second Object Name"
        value={objectName2}
        available-object-types="All"
        queryable-only
        field-level-help="Optional second object returned by the SOSL query."
        onobjectchange={handleSecondaryObjectChange}
      ></c-flow-config-object-picker>
    </template>

    <c-flow-config-value-input
      data-validatable
      data-property="queryString"
      label="SOQL Query String"
      property-name="queryString"
      value={queryString}
      value-data-type={queryStringDataType}
      builder-context={builderContext}
      automatic-output-variables={automaticOutputVariables}
      api-version={apiVersion}
      field-level-help="SOQL query text or a compatible Flow resource."
      onvaluechange={handleValueChange}
    ></c-flow-config-value-input>

    <template lwc:if={showSOSL}>
      <c-flow-config-value-input
        data-validatable
        data-property="searchString"
        label="SOSL Query String"
        property-name="searchString"
        value={searchString}
        value-data-type={searchStringDataType}
        builder-context={builderContext}
        automatic-output-variables={automaticOutputVariables}
        api-version={apiVersion}
        field-level-help="SOSL query text or a compatible Flow resource."
        onvaluechange={handleValueChange}
      ></c-flow-config-value-input>
    </template>

    <c-flow-config-value-input
      data-validatable
      data-property="aggQueryString"
      label="Aggregate Query String"
      property-name="aggQueryString"
      value={aggQueryString}
      value-data-type={aggQueryStringDataType}
      builder-context={builderContext}
      automatic-output-variables={automaticOutputVariables}
      api-version={apiVersion}
      field-level-help="Aggregate SOQL query text or a compatible Flow resource."
      onvaluechange={handleValueChange}
    ></c-flow-config-value-input>

    <c-flow-config-value-input
      data-validatable
      data-property="debounceTime"
      label="Debounce Time"
      property-name="debounceTime"
      value={debounceTime}
      value-data-type={debounceTimeDataType}
      builder-context={builderContext}
      automatic-output-variables={automaticOutputVariables}
      api-version={apiVersion}
      field-level-help="Delay in milliseconds before reactive queries run."
      onvaluechange={handleValueChange}
    ></c-flow-config-value-input>
  </template>
</template>
